name: Build ZF-Core App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.0'
        channel: 'stable'
        cache: true

    - name: Initialize Android Platform
      run: flutter create . --platforms=android --project-name=zuhri_formalism_app

    - name: Install Dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --release
